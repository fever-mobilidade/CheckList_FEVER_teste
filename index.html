<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checklist FEVER Oficial</title>
    <link rel="preload" href="./Font/fauna-thin.ttf" as="font" type="font/ttf" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
    <style>
        @font-face {
            font-family: 'fauna-thin';
            src: url('./Font/fauna-thin.ttf') format('truetype'); 
            font-weight: normal; font-style: normal; font-display: swap;
        }
        body { font-family: Arial, sans-serif; margin: 0; padding: 15px; background: #f4f4f4; color: #333; }
        .container { max-width: 600px; margin: auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .header { text-align: center; background: #000; color: #fff; padding: 20px; border-radius: 8px 8px 0 0; margin: -20px -20px 20px -20px; border-bottom: 4px solid #00ffcc; }
        .header h1 { margin: 0; color: #00ffcc !important; letter-spacing: 2px !important; font-size: 30px !important; font-family: 'fauna-thin', sans-serif !important; font-weight: 700 !important; text-transform: uppercase !important;}
        
        #step-gps { text-align: center; padding: 40px 10px; }
        #step-form { display: none; }
        #success-screen { display: none; text-align: center; padding: 40px 10px; }
        
        label { display: block; margin-top: 15px; font-weight: bold; font-size: 14px; }
        input, select, textarea { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        
        .placa-container { background: #e8f4f1; padding: 15px; border-radius: 8px; border: 2px solid #00ffcc; margin-top: 10px; text-align: center; }
        .placa-input { font-size: 24px !important; font-weight: bold !important; text-align: center; letter-spacing: 3px; border: 2px solid #000 !important; background: #fff !important; }
        .busca-container { display: flex; gap: 8px; margin-top: 10px; }
        .btn-busca { background: #000; color: #00ffcc; border: none; padding: 0 20px; border-radius: 4px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        
        /* ESTILOS DAS FOTOS CLICÁVEIS */
        .photo-item { 
            background: #ffffff; padding: 20px 15px; border-radius: 12px; text-align: center; 
            margin-bottom: 30px; border: 1px solid #eee; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .ref-container { 
            position: relative; margin-bottom: 10px; background: #f0f0f0; 
            padding: 10px; border-radius: 8px; border: 2px dashed #bbb; overflow: hidden;
            cursor: pointer;
        }
        .ref-container::before {
            content: "CLIQUE PARA ABRIR CÂMERA"; position: absolute; top: 2px; left: 0; width: 100%;
            font-size: 9px; font-weight: bold; color: #555; text-align: center;
        }
        .ref-img { width: 100%; max-width: 250px; height: auto; display: block; margin: 0 auto; opacity: 0.6; filter: grayscale(90%); padding-top: 10px; }
        
        .preview-img { width: 100%; height: auto; max-height: 350px; object-fit: contain; display: none; border: 3px solid #00ffcc; border-radius: 8px; cursor: pointer; }
        input[type="file"] { display: none; } /* Esconde o input original */

        canvas#signature-pad { border: 2px solid #000; width: 100%; height: 200px; background: #fff; border-radius: 4px; touch-action: none; }
        .btn-main { width: 100%; padding: 18px; background: #000; color: #00ffcc; border: none; font-weight: bold; font-size: 18px; cursor: pointer; border-radius: 4px; margin-top: 20px; }
        .btn-gps { background: #00ffcc; color: #000; animation: pulse 2s infinite; }
        .btn-secondary { background: #444; color: #fff; margin-top: 10px; font-size: 14px; }
        
        #loading { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); color: #00ffcc; z-index: 9999; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #00ffcc; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #msg-busca { margin-top: 8px; font-size: 13px; font-weight: bold; display: none; }
    </style>
</head>
<body>

<div id="loading"><div class="spinner"></div><p>ENVIANDO AUDITORIA...<br>Aguarde.</p></div>

<div class="container">
    <div class="header">
        <h1>FEVER</h1>
        <p>O FUTURO É ELETRIZANTE<br>CheckList Periódico</p>
    </div>

    <div id="step-gps">
        <h2>Localização do Checklist</h2>
        <button type="button" id="btn-gps" class="btn-main btn-gps" onclick="pegarLocalizacao()">📍 REGISTRAR LOCALIZAÇÃO</button>
    </div>

    <div id="step-form">
        <form id="formFever">
            <div class="placa-container">
                <label style="margin-top:0;">DIGITE A PLACA DO VEÍCULO *</label>
                <div class="busca-container">
                    <input type="text" id="placa" class="placa-input" required maxlength="8" placeholder="ABC1D23" 
                           oninput="this.value = this.value.toUpperCase()" 
                           onfocus="this.value = ''; resetarBuscaPlaca();" 
                           onblur="buscarNoBanco(this.value)">
                    <button type="button" class="btn-busca" onclick="buscarNoBanco(document.getElementById('placa').value)">BUSCAR</button>
                </div>
                <p id="msg-busca"></p>
            </div>

            <label>CHASSI</label>
            <input type="text" id="chassi" required readonly>
            <label>Modelo</label>
            <input type="text" id="modeloVeiculo" required readonly>
            <label>KM Atual *</label>
            <input type="number" id="km" required>
            <label>Empresa (Cliente)</label>
            <input type="text" id="empresa" required readonly>
            <label>CNPJ</label>
            <input type="text" id="cnpj" required readonly>
            <label>Nome do Usuário *</label>
            <input type="text" id="cliente" required>
            <label>Telefone *</label>
            <input type="tel" id="telefone" oninput="maskTel(this)" required>

            <label>Algum Dano?</label>
            <select id="dano" onchange="document.getElementById('campoObs').style.display=(this.value=='Sim'?'block':'none')">
                <option value="Não">Não</option>
                <option value="Sim">Sim</option>
            </select>

            <div id="campoObs" style="display:none; background: #fff1f1; padding: 15px; border-radius: 8px; border: 1px solid #ffcccc; margin-top: 10px;">
                <label>Descreva o dano *</label>
                <textarea id="desc" rows="3"></textarea>
                <label>Foto da Avaria *</label>
                <div class="photo-item">
                    <div class="ref-container" onclick="document.getElementById('inputFotoDano').click()">
                        <img src="https://cdn-icons-png.flaticon.com/512/685/685655.png" class="ref-img" style="width:60px;">
                    </div>
                    <input type="file" id="inputFotoDano" accept="image/*" capture="camera" onchange="compactarFotoDano(this)">
                    <img id="previewDano" class="preview-img" onclick="resetarFotoDano()">
                </div>
            </div>

            <h3>Fotos do veículo</h3>
            <div id="gridFotos">
                <p style="color: #666; font-size: 12px; text-align: center; border: 1px dashed #ccc; padding: 10px;">Aguardando placa...</p>
            </div>

            <h3>Assinatura *</h3>
            <canvas id="signature-pad"></canvas>
            <button type="button" onclick="pad.clear()" style="width:100%; padding:10px; margin-top:5px;">Limpar</button>
            <button type="submit" class="btn-main">FINALIZAR E ENVIAR</button>
        </form>
    </div>

    <div id="success-screen">
        <h1 style="font-size: 80px; color: #00ffcc; margin: 0;">✔</h1>
        <h2>Sucesso!</h2>
        <button onclick="location.reload()" class="btn-main">NOVO</button>
        <button onclick="fecharJanela()" class="btn-main btn-secondary">FECHAR EM <span id="timer">10</span>s</button>
    </div>
</div>

<script>
    let userLoc = "Não capturado"; let pad; const canvas = document.getElementById('signature-pad'); 
    const fotos = {}; let placaAtiva = ""; let fotoAvariaBase64 = ""; 
    const PATH_IMG = "./img/";

    const mapeamentoPorMarca = {
        "NEXTEM": { "Foto Frente": "nextem_frente.jpg", "Foto Lateral Direita": "nextem_lat_dir.jpg", "Foto Traseira": "nextem_traseira.jpg", "Foto Lateral Esquerda": "nextem_lat_esq.jpg", "Foto Placa": "nextem_placa.jpg", "Foto Chassi": "nextem_chassi.jpg", "Foto Painel/KM": "nextem_painel.jpg", "Foto Cabine": "nextem_cabine.jpg", "Foto Baú": "nextem_bau.jpg", "Foto Capô": "nextem_capo.jpg", "Foto Pneu DM": "nextem_pneu_dmot.jpg", "Foto Pneu DP": "nextem_pneu_dpass.jpg", "Foto Pneu TM": "nextem_pneu_tmot.jpg", "Foto Pneu TP": "nextem_pneu_tpass.jpg", "Foto Recarga": "nextem_recarga_p.jpg", "Foto Reparador": "nextem_reparador.jpg" },
        "RAP": { "Foto Frente": "rap_frente.jpg", "Foto Lateral Direita": "rap_lat_dir.jpg", "Foto Traseira": "rap_traseira.jpg", "Foto Lateral Esquerda": "rap_lat_esq.jpg", "Foto Placa": "rap_placa.jpg", "Foto Chassi": "rap_chassi.jpg", "Foto Painel/KM": "rap_painel.jpg", "Foto Banco": "rap_banco.jpg", "Foto Baú": "rap_bau.jpg", "Foto Pneu D": "rap_pneu_d.jpg", "Foto Pneu TD": "rap_pneu_td.jpg", "Foto Pneu TE": "rap_pneu_te.jpg", "Foto Recarga": "rap_recarga.jpg", "Foto Ferramentas": "rap_ferramentas.jpg" }
    };

    async function buscarNoBanco(placa) {
        const pL = placa.toUpperCase().trim().replace(/\s|-/g, "");
        if (pL.length < 7 || pL === placaAtiva) return;
        const msg = document.getElementById('msg-busca');
        msg.innerText = "🔍 Buscando..."; msg.style.color = "blue"; msg.style.display = "block";
        const url = `https://docs.google.com/spreadsheets/d/e/2PACX-1vRKYiYPdmLaEyTMG_lGfXzrZKA4zIn3e3UyynAP1_9GdMy9En-2dEmum6ubX5kLZcTa_E_kQn2aSXtH/pub?gid=128063943&single=true&output=csv`;
        try {
            const r = await fetch(url); const txt = await r.text();
            const linhas = txt.split('\n').map(l => l.split(',').map(c => c.replace(/"/g, "").trim()));
            const v = linhas.find(cols => cols[0].replace(/\s|-/g, "").toUpperCase() === pL);
            if (v) {
                placaAtiva = pL;
                document.getElementById('chassi').value = v[1]; document.getElementById('modeloVeiculo').value = v[2];
                document.getElementById('empresa').value = v[3]; document.getElementById('cnpj').value = v[4];
                msg.innerText = "✅ Localizado!"; msg.style.color = "green"; gerarCamposFotos();
            } else { msg.innerText = "❌ Placa não encontrada!"; msg.style.color = "red"; }
        } catch (e) { msg.innerText = "⚠️ Erro de conexão."; }
    }

    function resetarBuscaPlaca() {
        placaAtiva = "";
        ['chassi', 'modeloVeiculo', 'empresa', 'cnpj', 'km', 'cliente', 'telefone', 'desc'].forEach(id => {
            const el = document.getElementById(id);
            if(el) el.value = "";
        });
        document.getElementById('msg-busca').style.display = "none";
        document.getElementById('gridFotos').innerHTML = '<p style="color: #666; font-size: 12px; text-align: center; border: 1px dashed #ccc; padding: 10px;">Aguardando placa...</p>';
        fotoAvariaBase64 = "";
        document.getElementById('previewDano').style.display = 'none';
        document.getElementById('itemDano').querySelector('.ref-container').style.display = 'block';
    }

    function gerarCamposFotos() {
        const modFull = document.getElementById('modeloVeiculo').value.toUpperCase();
        const grid = document.getElementById('gridFotos'); grid.innerHTML = "";
        let marca = modFull.includes("NEXTEM") ? "NEXTEM" : "RAP";
        let etiquetas = Object.keys(mapeamentoPorMarca[marca]);
        
        etiquetas.forEach((label, i) => {
            const id = i + 1;
            const imgRef = PATH_IMG + (marca.toLowerCase() + "_") + mapeamentoPorMarca[marca][label];
            grid.innerHTML += `
                <div class="photo-item">
                    <strong>${label} *</strong>
                    <div class="ref-container" id="ref-box-${id}" onclick="document.getElementById('file-${id}').click()">
                        <img src="${imgRef}" class="ref-img" onerror="this.parentElement.style.display='none'">
                    </div>
                    <input type="file" id="file-${id}" accept="image/*" capture="camera" onchange="compactar(this, ${id})" required>
                    <img id="v${id}" class="preview-img" onclick="resetarFoto(${id})">
                </div>`;
        });
    }

    function compactar(input, id) {
        if (!input.files[0]) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image(); img.onload = () => {
                const cv = document.createElement('canvas'); const max = 800;
                let w = img.width, h = img.height;
                if (w > max) { h *= max/w; w = max; }
                cv.width = w; cv.height = h;
                cv.getContext('2d').drawImage(img, 0, 0, w, h);
                const base64 = cv.toDataURL('image/jpeg', 0.6);
                fotos['foto'+id] = base64;
                document.getElementById('ref-box-'+id).style.display = 'none';
                const prev = document.getElementById('v'+id);
                prev.src = base64; prev.style.display = 'block';
            }; img.src = e.target.result;
        }; reader.readAsDataURL(input.files[0]);
    }

    function resetarFoto(id) {
        if(confirm("Refazer foto?")) {
            document.getElementById('ref-box-'+id).style.display = 'block';
            document.getElementById('v'+id).style.display = 'none';
            delete fotos['foto'+id];
        }
    }

    function compactarFotoDano(input) {
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image(); img.onload = () => {
                const cv = document.createElement('canvas'); cv.width = 600; cv.height = 450;
                cv.getContext('2d').drawImage(img, 0, 0, 600, 450);
                fotoAvariaBase64 = cv.toDataURL('image/jpeg', 0.6);
                document.getElementById('campoObs').querySelector('.ref-container').style.display = 'none';
                const prev = document.getElementById('previewDano');
                prev.src = fotoAvariaBase64; prev.style.display = 'block';
            }; img.src = e.target.result;
        }; reader.readAsDataURL(input.files[0]);
    }

    function resetarFotoDano() {
        document.getElementById('campoObs').querySelector('.ref-container').style.display = 'block';
        document.getElementById('previewDano').style.display = 'none';
        fotoAvariaBase64 = "";
    }

    function pegarLocalizacao() {
        navigator.geolocation.getCurrentPosition((p) => {
            userLoc = `Lat: ${p.coords.latitude} Lon: ${p.coords.longitude}`;
            document.getElementById('step-gps').style.display = 'none';
            document.getElementById('step-form').style.display = 'block';
            pad = new SignaturePad(canvas); resizeCanvas();
        }, () => alert("Ative o GPS!"));
    }

    function fecharJanela() { window.close(); }
    
    function iniciarTimer() { 
        let seg = 10; 
        const contador = setInterval(() => { 
            seg--; 
            if(document.getElementById('timer')) document.getElementById('timer').innerText = seg; 
            if(seg <= 0) { clearInterval(contador); fecharJanela(); }
        }, 1000); 
    }

    function maskTel(i) { let v = i.value.replace(/\D/g, ""); v = v.replace(/^(\d{2})(\d)/g, "($1) $2"); v = v.replace(/(\d)(\d{4})$/, "$1-$2"); i.value = v; }
    function resizeCanvas() { const ratio = Math.max(window.devicePixelRatio || 1, 1); canvas.width = canvas.offsetWidth * ratio; canvas.height = canvas.offsetHeight * ratio; canvas.getContext("2d").scale(ratio, ratio); }

    document.getElementById("formFever").onsubmit = async (e) => {
        e.preventDefault(); 
        if(placaAtiva === "" || pad.isEmpty()) return alert("Preencha tudo e assine!");
        document.getElementById("loading").style.display = "flex";
        const payload = { ...fotos, fotoDano: fotoAvariaBase64, placa: placaAtiva, chassi: document.getElementById("chassi").value, modelo: document.getElementById("modeloVeiculo").value, km: document.getElementById("km").value, empresa: document.getElementById("empresa").value, cnpj: document.getElementById("cnpj").value, cliente: document.getElementById("cliente").value, telefone: document.getElementById("telefone").value, dano: document.getElementById("dano").value, desc: document.getElementById("desc").value || "", assinatura: pad.toDataURL(), localizacao: userLoc, timestamp: new Date().toLocaleString("pt-BR") };
        try {
            await fetch("https://script.google.com/macros/s/AKfycbwSlKIoGQVEjo-B4PF_Br5DanXf_altuPNAuXdyinAi6rfBFmL-okSGfcJDpAaVFbw/exec", { method: "POST", mode: "no-cors", body: JSON.stringify(payload) });
            document.getElementById("loading").style.display = "none"; 
            document.getElementById("step-form").style.display = "none"; 
            document.getElementById("success-screen").style.display = "block";
            iniciarTimer();
        } catch (err) { alert("Erro ao enviar."); }
    };
</script>
</body>
</html>
