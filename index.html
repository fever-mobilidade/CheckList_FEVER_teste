<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checklist FEVER Oficial</title>
    <link rel="preload" href="./Font/fauna-thin.ttf" as="font" type="font/ttf" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
    <style>
        @font-face {
            font-family: 'fauna-thin';
            src: url('./Font/fauna-thin.ttf') format('truetype'); 
            font-weight: normal; font-style: normal; font-display: swap;
        }
        body { font-family: Arial, sans-serif; margin: 0; padding: 15px; background: #f4f4f4; color: #333; }
        .container { max-width: 600px; margin: auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .header { text-align: center; background: #000; color: #fff; padding: 20px; border-radius: 8px 8px 0 0; margin: -20px -20px 20px -20px; border-bottom: 4px solid #00ffcc; }
        .header h1 { margin: 0; color: #00ffcc !important; letter-spacing: 2px !important; font-size: 30px !important; font-family: 'fauna-thin', sans-serif !important; font-weight: 700 !important; text-transform: uppercase !important;}
        
        /* Estilos dos containers de fotos */
        .photo-item { background: #f9f9f9; padding: 15px; border-radius: 8px; text-align: center; margin-bottom: 20px; border: 1px solid #ddd; }
        .preview-img { width: 100%; height: auto; max-height: 250px; object-fit: contain; display: none; margin-top: 10px; border: 2px solid #000; border-radius: 4px; }
        
        /* AJUSTE: Imagem de referência com 50% de transparência */
        .ref-container { margin-bottom: 12px; background: #eee; padding: 8px; border-radius: 5px; border: 1px dashed #bbb; }
        .ref-img { 
            width: 100%; 
            max-width: 180px; 
            height: auto; 
            border-radius: 4px; 
            border: 1px solid #ccc; 
            display: block; 
            margin: 5px auto;
            opacity: 0.5; /* Define a transparência em 50%  */
            filter: grayscale(30%); /* Opcional: deixa levemente cinza para diferenciar mais */
        }
        
        /* Restante dos estilos originais */
        #step-gps { text-align: center; padding: 40px 10px; }
        #step-form { display: none; }
        label { display: block; margin-top: 15px; font-weight: bold; font-size: 14px; }
        input, select, textarea { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        .placa-container { background: #e8f4f1; padding: 15px; border-radius: 8px; border: 2px solid #00ffcc; margin-top: 10px; text-align: center; }
        .placa-input { font-size: 24px !important; font-weight: bold !important; text-align: center; letter-spacing: 3px; border: 2px solid #000 !important; background: #fff !important; }
        .btn-main { width: 100%; padding: 18px; background: #000; color: #00ffcc; border: none; font-weight: bold; font-size: 18px; cursor: pointer; border-radius: 4px; margin-top: 20px; }
        #loading { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); color: #00ffcc; z-index: 9999; flex-direction: column; align-items: center; justify-content: center; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #00ffcc; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="loading"><div class="spinner"></div><p>ENVIANDO AUDITORIA...<br>Aguarde.</p></div>

<div class="container">
    <div class="header">
        <h1>FEVER</h1>
        <p>O FUTURO É ELETRIZANTE<br>CheckList Periódico</p>
    </div>

    <div id="step-gps">
        <h2>Localização do Checklist</h2>
        <p>Clique abaixo para registrar o local exato.</p>
        <button type="button" class="btn-main" onclick="pegarLocalizacao()">📍 REGISTRAR LOCALIZAÇÃO</button>
        <p id="status-gps" style="margin-top:15px; font-size:14px; font-weight: bold;"></p>
    </div>

    <div id="step-form">
        <form id="formFever">
            <div class="placa-container">
                <label>DIGITE A PLACA DO VEÍCULO *</label>
                <input type="text" id="placa" class="placa-input" required maxlength="8" onblur="buscarNoBanco(this.value)">
                <p id="msg-busca"></p>
            </div>

            <input type="hidden" id="chassi">
            <input type="hidden" id="modeloVeiculo">
            <input type="hidden" id="empresa">
            <input type="hidden" id="cnpj">

            <label>KM Atual *</label>
            <input type="number" id="km" required>
            
            <label>Nome do Usuário *</label><input type="text" id="cliente" required>
            <label>Telefone *</label><input type="tel" id="telefone" oninput="maskTel(this)" required>

            <label>Algum Dano?</label>
            <select id="dano" onchange="document.getElementById('campoObs').style.display=(this.value=='Sim'?'block':'none')">
                <option value="Não">Não</option>
                <option value="Sim">Sim</option>
            </select>

            <div id="campoObs" style="display:none;">
                <label>Descreva o dano</label>
                <textarea id="desc" rows="3"></textarea>
            </div>

            <h3>Fotos do veículo</h3>
            <div id="gridFotos">
                <p style="text-align: center;">Busque a placa primeiro.</p>
            </div>

            <canvas id="signature-pad" style="border:1px solid #000; width:100%; height:200px; margin-top:20px;"></canvas>
            <button type="button" onclick="pad.clear()">Limpar Assinatura</button>
            <button type="submit" class="btn-main">FINALIZAR E ENVIAR</button>
        </form>
    </div>
</div>

<script>
    let userLoc = ""; let pad; const fotos = {}; let placaAtiva = "";
    const PATH_IMG = "./img/";

    // Listas de etiquetas conforme a marca 
    const fotosNextem = ["Foto Frente", "Foto Lateral Direita", "Foto Traseira", "Foto Lateral Esquerda", "Foto Placa", "Foto Chassi", "Foto Painel/KM (LIGADO)", "Foto Cabine interna", "Foto Interna do Baú", "Foto Capô interna", "Foto Roda/Pneu (DIANTEIRO) Motorista", "Foto Roda/Pneu (DIANTEIRO) Passageiro", "Foto Roda/Pneu (TRASEIRO) Motorista", "Foto Roda/Pneu (TRASEIRO) Passageiro", "Foto Estação de Recarga portatil", "Foto Frasco Reparador de Pneu"];
    const fotosRap = ["Foto Frente", "Foto Lateral Direita", "Foto Traseira", "Foto Lateral Esquerda", "Foto Placa", "Foto Chassi", "Foto Painel/KM (LIGADO)", "Foto Banco (assento)", "Foto Interna do Baú", "Foto Roda/Pneu (DIANTEIRO)", "Foto Roda/Pneu (Traseiro Direito)", "Foto Roda/Pneu (Traseiro Esquerdo)", "Foto Estação de Recarga", "Foto Kit Ferramentas"];

    const mapeamentoPorMarca = {
        "NEXTEM": {
            "Foto Frente": "frente.jpg", "Foto Lateral Direita": "lat_dir.jpg", "Foto Traseira": "traseira.jpg",
            "Foto Lateral Esquerda": "lat_esq.jpg", "Foto Placa": "placa.jpg", "Foto Chassi": "chassi.jpg",
            "Foto Painel/KM (LIGADO)": "painel.jpg", "Foto Cabine interna": "cabine.jpg", "Foto Interna do Baú": "bau.jpg",
            "Foto Capô interna": "capo.jpg", "Foto Roda/Pneu (DIANTEIRO) Motorista": "pneu_dmot.jpg",
            "Foto Roda/Pneu (DIANTEIRO) Passageiro": "pneu_dpass.jpg", "Foto Roda/Pneu (TRASEIRO) Motorista": "pneu_tmot.jpg",
            "Foto Roda/Pneu (TRASEIRO) Passageiro": "pneu_tpass.jpg", "Foto Estação de Recarga portatil": "recarga_p.jpg",
            "Foto Frasco Reparador de Pneu": "reparador.jpg"
        },
        "RAP": {
            "Foto Frente": "frente.jpg", "Foto Lateral Direita": "lat_dir.jpg", "Foto Traseira": "traseira.jpg",
            "Foto Lateral Esquerda": "lat_esq.jpg", "Foto Placa": "placa.jpg", "Foto Chassi": "chassi.jpg",
            "Foto Painel/KM (LIGADO)": "painel.jpg", "Foto Banco (assento)": "banco.jpg", "Foto Interna do Baú": "bau.jpg",
            "Foto Roda/Pneu (DIANTEIRO)": "pneu_d.jpg", "Foto Roda/Pneu (Traseiro Direito)": "pneu_td.jpg",
            "Foto Roda/Pneu (Traseiro Esquerdo)": "pneu_te.jpg", "Foto Estação de Recarga": "recarga.jpg",
            "Foto Kit Ferramentas": "ferramentas.jpg"
        }
    };

    async function buscarNoBanco(placa) {
        if (placa.length < 7) return;
        const url = `https://docs.google.com/spreadsheets/d/e/2PACX-1vRKYiYPdmLaEyTMG_lGfXzrZKA4zIn3e3UyynAP1_9GdMy9En-2dEmum6ubX5kLZcTa_E_kQn2aSXtH/pub?gid=128063943&single=true&output=csv`;
        try {
            const r = await fetch(url); const txt = await r.text();
            const linhas = txt.split('\n').map(l => l.split(',').map(c => c.replace(/"/g, "").trim()));
            const v = linhas.find(cols => cols[0].toUpperCase() === placa.toUpperCase());
            if (v) {
                document.getElementById('chassi').value = v[1]; document.getElementById('modeloVeiculo').value = v[2];
                document.getElementById('empresa').value = v[3]; document.getElementById('cnpj').value = v[4];
                placaAtiva = placa; gerarCamposFotos();
            }
        } catch (e) { console.error("Erro na busca"); }
    }

    function gerarCamposFotos() {
        const modFull = document.getElementById('modeloVeiculo').value.toUpperCase();
        const grid = document.getElementById('gridFotos'); grid.innerHTML = "";
        
        let marca = modFull.includes("NEXTEM") ? "NEXTEM" : "RAP";
        let prefixo = marca.toLowerCase() + "_";
        let listaEtiquetas = (marca === "NEXTEM") ? fotosNextem : fotosRap; [cite: 1, 3]

        listaEtiquetas.forEach((label, i) => {
            const nomeArquivo = mapeamentoPorMarca[marca][label] || "";
            const caminhoRef = nomeArquivo ? PATH_IMG + prefixo + nomeArquivo : "";
            
            const htmlRef = caminhoRef ? `
                <div class="ref-container">
                    <span style="font-size:10px; font-weight:bold; color:#666;">REFERÊNCIA:</span>
                    <img src="${caminhoRef}" class="ref-img" onerror="this.parentElement.style.display='none'">
                </div>` : "";

            grid.innerHTML += `
                <div class="photo-item">
                    <label>${label} *</label>
                    ${htmlRef}
                    <input type="file" accept="image/*" capture="camera" onchange="compactar(this, ${i+1})" required>
                    <img id="v${i+1}" class="preview-img">
                </div>`;
        });
    }

    function pegarLocalizacao() {
        navigator.geolocation.getCurrentPosition((p) => {
            userLoc = `Lat: ${p.coords.latitude} Lon: ${p.coords.longitude}`;
            document.getElementById('status-gps').innerText = "📍 Localização capturada!";
            document.getElementById('step-gps').style.display = 'none';
            document.getElementById('step-form').style.display = 'block';
            pad = new SignaturePad(document.getElementById('signature-pad'));
        });
    }

    function compactar(input, id) {
        if (!input.files[0]) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
                const cv = document.createElement('canvas');
                const max = 800; let w = img.width, h = img.height;
                if (w > max) { h *= max / w; w = max; }
                cv.width = w; cv.height = h;
                cv.getContext('2d').drawImage(img, 0, 0, w, h);
                fotos['foto'+id] = cv.toDataURL('image/jpeg', 0.6);
                const preview = document.getElementById('v'+id);
                preview.src = fotos['foto'+id]; preview.style.display = 'block';
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(input.files[0]);
    }

    function maskTel(i) { let v = i.value.replace(/\D/g, ""); v = v.replace(/^(\d{2})(\d)/g, "($1) $2"); v = v.replace(/(\d)(\d{4})$/, "$1-$2"); i.value = v; }

    document.getElementById("formFever").onsubmit = async (e) => {
        e.preventDefault();
        if(pad.isEmpty()) return alert("Assine o checklist!");
        document.getElementById("loading").style.display = "flex";
        const payload = { ...fotos, placa: placaAtiva, localizacao: userLoc, assinatura: pad.toDataURL(), timestamp: new Date().toLocaleString("pt-BR") };
        // Envio para o Apps Script (URL encurtada do seu script original)
        await fetch("https://script.google.com/macros/s/AKfycbwq9SlcLP9bCDT27SU1w_mAo3wmA98abYt3qSGriNYeqxewrT4C2wsk0Q9tnq6GgPAb/exec", 
        { method: "POST", mode: "no-cors", body: JSON.stringify(payload) });
        alert("Enviado com sucesso!"); location.reload();
    };
</script>
</body>
</html>
