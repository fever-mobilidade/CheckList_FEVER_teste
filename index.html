<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checklist FEVER Entrega</title>
    <link rel="preload" href="./Font/fauna-thin.ttf" as="font" type="font/ttf" crossorigin>
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
    <style>
        @font-face { font-family: 'fauna-thin'; src: url('./Font/fauna-thin.ttf') format('truetype'); font-weight: normal; font-style: normal; font-display: swap; }
        body { font-family: Arial, sans-serif; margin: 0; padding: 15px; background: #f4f4f4; color: #333; }
        .container { max-width: 600px; margin: auto; background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .header { text-align: center; background: #000; color: #fff; padding: 20px; border-radius: 8px 8px 0 0; margin: -15px -15px 20px -15px; border-bottom: 4px solid #00ffcc; }
        .header h1 { margin: 0; color: #00ffcc; font-size: 30px; font-family: 'fauna-thin', sans-serif; text-transform: uppercase;}
        #step-gps, #step-form, #success-screen { display: none; }
        #step-gps { display: block; text-align: center; padding: 40px 10px; }
        label { display: block; margin-top: 15px; font-weight: bold; font-size: 14px; }
        input, select, textarea { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        .placa-container { background: #e8f4f1; padding: 15px; border-radius: 8px; border: 2px solid #00ffcc; margin-top: 10px; text-align: center; }
        .placa-input { font-size: 24px !important; font-weight: bold !important; text-align: center; letter-spacing: 3px; border: 2px solid #000 !important; }
        .busca-container { display: flex; gap: 8px; margin-top: 10px; }
        .btn-busca { background: #000; color: #00ffcc; border: none; padding: 0 20px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .photo-item { background: #fff; padding: 15px; border-radius: 10px; text-align: center; margin-bottom: 25px; border: 1px solid #eee; }
        .ref-container { background: #f9f9f9; padding: 10px; border-radius: 8px; border: 2px dashed #ccc; margin-bottom: 10px; }
        .preview-img { width: 100%; border: 3px solid #00ffcc; border-radius: 8px; display: none; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        th, td { border: 1px solid #ddd; padding: 10px; }
        .radio-group { display: flex; gap: 15px; }
        canvas#signature-pad { border: 2px solid #000; width: 100%; height: 200px; background: #fff; margin-top: 10px; touch-action: none; }
        .btn-main { width: 100%; padding: 18px; background: #000; color: #00ffcc; border: none; font-weight: bold; font-size: 18px; cursor: pointer; border-radius: 4px; margin-top: 20px; }
        #loading { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); color: #00ffcc; z-index: 9999; flex-direction: column; align-items: center; justify-content: center; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #00ffcc; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="loading"><div class="spinner"></div><p>ENVIANDO...</p></div>

<div class="container">
    <div class="header"><h1>FEVER</h1><p>Checklist de Entrega</p></div>

    <div id="step-gps">
        <h2>Localização</h2>
        <button type="button" class="btn-main" onclick="pegarLocalizacao()">📍 REGISTRAR LOCALIZAÇÃO</button>
    </div>

    <div id="step-form">
        <form id="formFever">
            <div class="placa-container">
                <label>PLACA DO VEÍCULO *</label>
                <div class="busca-container">
                    <input type="text" id="placa" class="placa-input" required maxlength="8" oninput="this.value = this.value.toUpperCase()">
                    <button type="button" class="btn-busca" onclick="buscarNoBanco()">BUSCAR</button>
                </div>
                <p id="msg-busca" style="font-size:12px; margin-top:5px; font-weight:bold;"></p>
            </div>

            <label>Modelo</label><input type="text" id="modeloVeiculo" readonly>
            <label>Empresa</label><input type="text" id="empresa" readonly>
            <label>CNPJ</label><input type="text" id="cnpj" readonly>
            <label>KM Atual *</label><input type="number" id="km" required>
            <label>Usuário Responsável *</label><input type="text" id="cliente" required>
            <label>Data Entrega *</label><input type="date" id="dataRecebimento" required>

            <h3>Itens de Inspeção</h3>
            <table id="tabelaItens"></table>

            <label>Avaria?</label>
            <select id="dano" onchange="document.getElementById('campoObs').style.display=(this.value=='Sim'?'block':'none')">
                <option value="Não">Não</option><option value="Sim">Sim</option>
            </select>
            <div id="campoObs" style="display:none;"><textarea id="desc" placeholder="Descreva a avaria..."></textarea></div>

            <h3>Fotos do Veículo (7 Fotos)</h3>
            <div id="gridFotos"></div>

            <h3>Assinatura *</h3>
            <canvas id="signature-pad"></canvas>
            <button type="button" onclick="pad.clear()" style="width:100%; margin-top:5px;">Limpar</button>
            <button type="submit" class="btn-main">FINALIZAR ENTREGA</button>
        </form>
    </div>

    <div id="success-screen">
        <h1 style="font-size: 60px; color: #00ffcc;">✔</h1>
        <h2>Enviado com Sucesso!</h2>
        <button id="btn-novo" onclick="location.reload()" class="btn-main">NOVO (10s)</button>
    </div>
</div>

<script>
    let userLoc = ""; let pad; const canvas = document.getElementById('signature-pad');
    const fotos = {}; let placaAtiva = "";

    const itens = ["Pintura e Lataria", "Pneus", "Rodas", "Parabrisa e palhetas", "Retrovisores", "Documentação", "Chave do veiculo e baú", "Kit de ferramentas", "Adesivos e Etiquetas", "Painel e Cabine", "Estação de Recarga portátil", "Luzes externas", "Luzes internas", "Ar-condicionado", "Vidros e travas elétricas", "Kit Reparo do Pneu", "Central Multimidia"];
    const labelsEntrega = ["Foto Frente", "Foto Lateral Direita", "Foto Traseira", "Foto Lateral Esquerda", "Foto Painel/KM", "Foto Placa", "Foto Assinatura no canhoto"];
    
    // Nomes de ficheiros de referência para Entrega
    const refImgs = ["frente.jpg", "lat_dir.jpg", "traseira.jpg", "lat_esq.jpg", "painel.jpg", "placa.jpg", "canhoto.jpg"];

    // Renderiza os 17 itens na tabela
    document.getElementById('tabelaItens').innerHTML = itens.map((it, i) => `
        <tr><td>${it}</td><td>
            <div class="radio-group">
                <label><input type="radio" name="item_${i}" value="OK" required> OK</label>
                <label><input type="radio" name="item_${i}" value="Não OK"> X</label>
            </div>
        </td></tr>`).join('');

    async function buscarNoBanco() {
        const pL = document.getElementById('placa').value.toUpperCase().trim().replace(/-/g, "");
        if (pL.length < 7) return;
        const msg = document.getElementById('msg-busca');
        msg.innerText = "🔍 Buscando...";
        const url = `https://docs.google.com/spreadsheets/d/e/2PACX-1vRKYiYPdmLaEyTMG_lGfXzrZKA4zIn3e3UyynAP1_9GdMy9En-2dEmum6ubX5kLZcTa_E_kQn2aSXtH/pub?gid=128063943&single=true&output=csv`;
        try {
            const r = await fetch(url); const txt = await r.text();
            const linhas = txt.split('\n').map(l => l.split(',').map(c => c.replace(/"/g, "").trim()));
            const v = linhas.find(cols => cols[0].replace(/-/g, "").toUpperCase() === pL);
            if (v) {
                placaAtiva = pL;
                document.getElementById('modeloVeiculo').value = v[2];
                document.getElementById('empresa').value = v[3];
                document.getElementById('cnpj').value = v[4];
                msg.innerText = "✅ Veículo Localizado!"; msg.style.color = "green";
                gerarCamposFotos(v[2]);
            } else { msg.innerText = "❌ Placa não encontrada"; msg.style.color = "red"; }
        } catch (e) { msg.innerText = "⚠️ Erro de conexão"; }
    }

    function gerarCamposFotos(modelo) {
        const grid = document.getElementById('gridFotos'); grid.innerHTML = "";
        const marca = modelo.toUpperCase().includes("NEXTEM") ? "NEXTEM" : "RAP";
        const prefixo = marca.toLowerCase() + "_";

        labelsEntrega.forEach((label, i) => {
            grid.innerHTML += `
                <div class="photo-item">
                    <label>${label} *</label>
                    <div class="ref-container" id="ref-${i+1}">
                        <img src="./img/${prefixo}${refImgs[i]}" style="width:100%; max-width:180px; opacity:0.5; filter:grayscale(1);">
                    </div>
                    <input type="file" accept="image/*" capture="camera" onchange="compactar(this, ${i+1})" required id="in-${i+1}">
                    <img id="v${i+1}" class="preview-img" onclick="resetarFoto(${i+1})">
                </div>`;
        });
    }

    function compactar(input, id) {
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image(); img.onload = () => {
                const cv = document.createElement('canvas'); const max = 800;
                let w = img.width, h = img.height;
                if (w > max) { h *= max/w; w = max; }
                cv.width = w; cv.height = h;
                cv.getContext('2d').drawImage(img, 0, 0, w, h);
                const base64 = cv.toDataURL('image/jpeg', 0.7);
                fotos['foto'+id] = base64;
                document.getElementById('v'+id).src = base64;
                document.getElementById('v'+id).style.display = 'block';
                document.getElementById('ref-'+id).style.display = 'none';
                document.getElementById('in-'+id).style.display = 'none';
            }; img.src = e.target.result;
        }; reader.readAsDataURL(input.files[0]);
    }

    function resetarFoto(id) {
        if(confirm("Deseja tirar a foto novamente?")) {
            document.getElementById('v'+id).style.display = 'none';
            document.getElementById('ref-'+id).style.display = 'block';
            document.getElementById('in-'+id).style.display = 'block';
            delete fotos['foto'+id];
        }
    }

    function pegarLocalizacao() {
        navigator.geolocation.getCurrentPosition((p) => {
            userLoc = `Lat: ${p.coords.latitude} Lon: ${p.coords.longitude} (${p.coords.accuracy.toFixed(0)}m)`;
            document.getElementById('step-gps').style.display = 'none';
            document.getElementById('step-form').style.display = 'block';
            pad = new SignaturePad(canvas); resizeCanvas();
        }, () => alert("O GPS é obrigatório para este processo!"));
    }

    function resizeCanvas() { const r = Math.max(window.devicePixelRatio || 1, 1); canvas.width = canvas.offsetWidth * r; canvas.height = canvas.offsetHeight * r; canvas.getContext("2d").scale(r, r); }

    function iniciarTimer() {
        let tempo = 10; const btn = document.getElementById("btn-novo");
        const intervalo = setInterval(() => {
            tempo--; btn.innerText = `NOVO (${tempo}s)`;
            if (tempo <= 0) { clearInterval(intervalo); location.reload(); }
        }, 1000);
    }

    document.getElementById("formFever").onsubmit = async (e) => {
        e.preventDefault();
        if(pad.isEmpty()) return alert("Por favor, assine o documento.");
        document.getElementById("loading").style.display = "flex";
        
        const checks = {};
        itens.forEach((_, i) => { 
            const el = document.querySelector(`input[name="item_${i}"]:checked`);
            checks["item_" + i] = el ? el.value : "N/A"; 
        });

        const payload = { 
            ...fotos, 
            checklistItems: checks, 
            placa: placaAtiva, 
            modelo: document.getElementById('modeloVeiculo').value, 
            km: document.getElementById('km').value, 
            empresa: document.getElementById('empresa').value, 
            cnpj: document.getElementById('cnpj').value, 
            cliente: document.getElementById('cliente').value, 
            dataRecebimento: document.getElementById('dataRecebimento').value, 
            dano: document.getElementById('dano').value, 
            desc: document.getElementById('desc').value || "", 
            assinatura: pad.toDataURL(), 
            localizacao: userLoc, 
            timestamp: new Date().toLocaleString("pt-BR") 
        };

        try {
            // Substitua pela sua URL de execução do Script do Google
            const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwSTwbiD_5_tS6Z8GiWlSfURzc9hMiWONsbnyp8fCkP-g88ZI_dXloC4WbMiD7CWTDz/exec";
            await fetch(SCRIPT_URL, { method: "POST", mode: "no-cors", body: JSON.stringify(payload) });
            document.getElementById("loading").style.display = "none";
            document.getElementById("step-form").style.display = "none";
            document.getElementById("success-screen").style.display = "block";
            iniciarTimer();
        } catch (err) { alert("Erro ao enviar!"); document.getElementById("loading").style.display = "none"; }
    };
</script>
</body>
</html>
