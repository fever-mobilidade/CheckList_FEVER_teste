<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checklist FEVER Oficial</title>

<style>
body { font-family: Arial, sans-serif; margin: 0; padding: 15px; background: #f4f4f4; color: #333; }
.container { max-width: 600px; margin: auto; background: #fff; padding: 10px; border-radius: 8px; }

/* FOTO GUIA */
.foto-guia {
    position: relative;
    width: 100%;
    height: 180px;
    border: 2px dashed #00ffcc;
    border-radius: 8px;
    overflow: hidden;
    margin-top: 10px;
}

.img-guia {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: contain;
    opacity: 0.25;
    filter: grayscale(100%);
    pointer-events: none;
}

.foto-guia input {
    position: absolute;
    width: 100%;
    height: 100%;
    opacity: 0;
    cursor: pointer;
}

.preview-img {
    width: 100%;
    margin-top: 10px;
    border: 2px solid #000;
    border-radius: 4px;
    display: none;
}
</style>
</head>

<body>

<div class="container">
<h3>Fotos do veículo</h3>
<div id="gridFotos"></div>
</div>

<script>

/* LABELS */
const fLabels = [
"Foto de Frente",
"Foto Lateral Direita (motorista)",
"Foto Traseira",
"Foto Lateral Esquerda (passageiro)",
"Foto da Placa",
"Foto do Chassi",
"Foto do Painel/KM"
];

/* REFERÊNCIAS (SEUS NOMES REAIS + CORREÇÃO DE ESPAÇO) */
const referencias = [
"img/frete.png",
"img/lateral direita.png",
"img/traseira.png",
"img/lateral esquerda.png",
"img/placa.png",
"img/chassi.png",
"img/painel.png"
].map(c => encodeURI(c));

/* GERAR CAMPOS */
fLabels.forEach((l, i) => {
    document.getElementById('gridFotos').innerHTML += `
    <div class="photo-item">
        <label>${l}</label>

        <div class="foto-guia">
            <img src="${referencias[i]}" class="img-guia">
            <input type="file" accept="image/*" capture="environment" onchange="compactar(this, ${i+1})" required>
        </div>

        <img id="v${i+1}" class="preview-img">
    </div>`;
});

/* COMPRESSÃO + PREVIEW */
const fotos = {};

function compactar(input, id) {
    if (!input.files[0]) return;

    const reader = new FileReader();

    reader.onload = (e) => {
        const img = new Image();

        img.onload = () => {
            const cv = document.createElement('canvas');
            const max = 1000;
            let w = img.width, h = img.height;

            if (w > max) {
                h *= max / w;
                w = max;
            }

            cv.width = w;
            cv.height = h;

            cv.getContext('2d').drawImage(img, 0, 0, w, h);

            const b64 = cv.toDataURL('image/jpeg', 0.7);

            fotos['foto' + id] = b64;

            const preview = document.getElementById('v' + id);
            preview.src = b64;
            preview.style.display = 'block';
        };

        img.src = e.target.result;
    };

    reader.readAsDataURL(input.files[0]);
}

</script>

</body>
</html>
