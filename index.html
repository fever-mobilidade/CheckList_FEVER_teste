<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checklist FEVER Oficial</title>
    <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 15px; background: #f4f4f4; color: #333; }
        .container { max-width: 600px; margin: auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .header { text-align: center; background: #000; color: #fff; padding: 20px; border-radius: 8px 8px 0 0; margin: -20px -20px 20px -20px; border-bottom: 4px solid #00ffcc; }
        .header h1 { margin: 0; color: #00ffcc; font-family: 'Oxanium', sans-serif; text-transform: uppercase; }

        #step-gps { text-align: center; padding: 40px 10px; }
        #step-form { display: none; }
        
        /* Estilo dos itens de foto */
        .photo-item { 
            background: #ffffff; padding: 15px; border-radius: 12px; text-align: center; 
            margin-bottom: 25px; border: 1px solid #eee; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        /* Container da Imagem de Referência - CLICÁVEL */
        .ref-container { 
            position: relative; margin: 10px auto; background: #f9f9f9; 
            padding: 10px; border: 2px dashed #00ffcc; border-radius: 8px; 
            cursor: pointer; min-height: 100px; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .ref-container:active { background: #e0fff9; }
        .ref-container::before {
            content: "TOQUE PARA ABRIR CÂMERA"; position: absolute; top: 5px; 
            font-size: 9px; font-weight: bold; color: #000; opacity: 0.6;
        }
        .ref-img { width: 100%; max-width: 200px; height: auto; border-radius: 4px; display: block; }
        
        /* Ocultar o input de arquivo padrão, pois usaremos o clique na imagem */
        input[type="file"] { display: none; }

        .preview-img { width: 100%; height: auto; max-height: 400px; object-fit: contain; display: none; border: 3px solid #00ffcc; border-radius: 8px; cursor: pointer; }
        
        canvas#signature-pad { border: 2px solid #000; width: 100%; height: 200px; background: #fff; border-radius: 4px; touch-action: none; }
        .btn-main { width: 100%; padding: 18px; background: #000; color: #00ffcc; border: none; font-weight: bold; font-size: 18px; cursor: pointer; border-radius: 4px; margin-top: 20px; }
        .btn-gps { background: #00ffcc; color: #000; }
        #loading { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); color: #00ffcc; z-index: 9999; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body>

<div id="loading"><div>Aguarde...</div></div>

<div class="container">
    <div class="header">
        <h1>FEVER</h1>
        <p>CheckList Periódico</p>
    </div>

    <div id="step-gps">
        <button type="button" class="btn-main btn-gps" onclick="pegarLocalizacao()">📍 REGISTRAR LOCALIZAÇÃO E INICIAR</button>
    </div>

    <div id="step-form">
        <form id="formFever">
            <label>Placa do Veículo</label>
            <input type="text" id="placa" onblur="buscarNoBanco(this.value)" placeholder="ABC1D23" required>
            <p id="msg-busca"></p>

            <div id="dados-veiculo" style="display:none">
                <label>Modelo</label>
                <input type="text" id="modeloVeiculo" readonly>
                <label>KM Atual</label>
                <input type="number" id="km" required>
                
                <h3>Fotos Obrigatórias</h3>
                <div id="gridFotos"></div>

                <h3>Assinatura</h3>
                <canvas id="signature-pad"></canvas>
                <button type="button" onclick="pad.clear()" style="width:100%; padding:10px;">Limpar</button>
                <button type="submit" class="btn-main">ENVIAR CHECKLIST</button>
            </div>
        </form>
    </div>
</div>

<script>
    let userLoc = ""; let pad; const fotos = {};
    
    const PATH_IMG = "./img/";

    const mapeamento = {
        "NEXTEM": ["Foto Frente", "Foto Traseira", "Foto Lateral Direita", "Foto Lateral Esquerda", "Foto Placa", "Foto Painel", "Foto Chassi"],
        "RAP": ["Foto Frente", "Foto Traseira", "Foto Lateral Direita", "Foto Lateral Esquerda", "Foto Placa", "Foto Painel", "Foto Chassi"]
    };

    const arquivos = {
        "Foto Frente": "frente.jpg", "Foto Traseira": "traseira.jpg",
        "Foto Lateral Direita": "lat_dir.jpg", "Foto Lateral Esquerda": "lat_esq.jpg",
        "Foto Placa": "placa.jpg", "Foto Painel": "painel.jpg", "Foto Chassi": "chassi.jpg"
    };

    async function buscarNoBanco(placa) {
        if (placa.length < 7) return;
        // Simulação de busca (integre com o seu fetch da planilha se desejar)
        document.getElementById('modeloVeiculo').value = "NEXTEM FN1000"; 
        document.getElementById('dados-veiculo').style.display = "block";
        gerarCamposFotos("NEXTEM");
    }

    function gerarCamposFotos(marca) {
        const grid = document.getElementById('gridFotos');
        grid.innerHTML = "";
        const lista = mapeamento[marca];
        const prefixo = marca.toLowerCase() + "_";

        lista.forEach((label, i) => {
            const id = i + 1;
            const nomeArq = arquivos[label];
            const urlCompleta = PATH_IMG + prefixo + nomeArq;

            grid.innerHTML += `
                <div class="photo-item">
                    <strong>${label} *</strong>
                    <div class="ref-container" id="ref-box-${id}" onclick="document.getElementById('file-${id}').click()">
                        <img src="${urlCompleta}" class="ref-img" onerror="substituirPorIcone(this)">
                        <span style="font-size:10px; color:#666; margin-top:5px;">Clique para tirar a foto</span>
                    </div>
                    
                    <input type="file" id="file-${id}" accept="image/*" capture="camera" onchange="processarFoto(this, ${id})">
                    
                    <img id="prev-${id}" class="preview-img" onclick="document.getElementById('file-${id}').click()">
                </div>`;
        });
    }

    // Caso a imagem do GitHub não carregue, mostra um ícone de câmera
    function substituirPorIcone(img) {
        img.src = "https://cdn-icons-png.flaticon.com/512/685/685655.png";
        img.style.width = "50px";
        img.style.opacity = "0.3";
    }

    function processarFoto(input, id) {
        if (!input.files[0]) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
                const cv = document.createElement('canvas');
                const max = 800; let w = img.width, h = img.height;
                if (w > max) { h *= max / w; w = max; }
                cv.width = w; cv.height = h;
                cv.getContext('2d').drawImage(img, 0, 0, w, h);
                const base64 = cv.toDataURL('image/jpeg', 0.7);
                
                fotos['foto'+id] = base64;
                document.getElementById('ref-box-'+id).style.display = 'none';
                const preview = document.getElementById('prev-'+id);
                preview.src = base64;
                preview.style.display = 'block';
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(input.files[0]);
    }

    function pegarLocalizacao() {
        navigator.geolocation.getCurrentPosition((p) => {
            userLoc = `Lat: ${p.coords.latitude} Lon: ${p.coords.longitude}`;
            document.getElementById('step-gps').style.display = 'none';
            document.getElementById('step-form').style.display = 'block';
            pad = new SignaturePad(document.getElementById('signature-pad'));
        }, () => alert("Ative o GPS para continuar."));
    }

    document.getElementById("formFever").onsubmit = async (e) => {
        e.preventDefault();
        if(pad.isEmpty()) return alert("Assine o documento!");
        document.getElementById("loading").style.display = "flex";
        // Envio para o Apps Script...
        alert("Enviado com sucesso!");
        location.reload();
    };
</script>
</body>
</html>
